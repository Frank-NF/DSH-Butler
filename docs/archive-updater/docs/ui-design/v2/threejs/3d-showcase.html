<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>3D 效果 - DSH 插件升级管理</title><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><style>:root{--primary:#6366F1;--primary-light:#818CF8;--accent:#10B981;--warning:#F59E0B;--danger:#EF4444;--bg-primary:#0F172A;--bg-secondary:#1E293B;--text-primary:#F8FAFC;--text-secondary:#CBD5E1;--text-muted:#94A3B8}body{font-family:Inter,sans-serif;background:var(--bg-primary);color:var(--text-primary);margin:0;overflow-x:hidden}.three-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}.feature-3d{position:relative;z-index:1;padding:100px 24px;min-height:100vh;display:flex;align-items:center;justify-content:center}.content{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}@media(max-width:768px){.content{grid-template-columns:1fr}}.text h1{font-size:48px;font-weight:800;margin-bottom:24px;background:linear-gradient(135deg,var(--text-primary),var(--primary-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.text p{font-size:18px;color:var(--text-secondary);line-height:1.6;margin-bottom:32px}.card{background:rgba(30,41,59,0.8);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:24px;transition:all 0.3s}.card:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,0.4);border-color:var(--primary)}</style></head><body><div id="three-container" class="three-container"></div><section class="feature-3d"><div class="content"><div class="text"><h1>3D 可视化体验</h1><p>使用 Three.js 打造沉浸式 3D 界面效果，让工具界面更加现代和专业。</p><div style="display:flex;gap:16px;flex-wrap:wrap"><div class="card"><h3 style="color:var(--primary-light);margin-bottom:8px">粒子系统</h3><p style="font-size:14px;color:var(--text-muted)">1500+ 粒子动态效果</p></div><div class="card"><h3 style="color:var(--accent);margin-bottom:8px">鼠标交互</h3><p style="font-size:14px;color:var(--text-muted)">跟随鼠标旋转</p></div></div></div><div id="canvas3d" style="width:100%;height:400px"></div></div></section><script>const container=document.getElementById("three-container");const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));container.appendChild(renderer.domElement);const geometry=new THREE.IcosahedronGeometry(1,1);const material=new THREE.MeshBasicMaterial({color:0x6366F1,wireframe:true,transparent:true,opacity:0.3});const mesh=new THREE.Mesh(geometry,material);scene.add(mesh);const geometry2=new THREE.TorusGeometry(1.5,0.3,16,100);const material2=new THREE.MeshBasicMaterial({color:0x818CF8,wireframe:true,transparent:true,opacity:0.2});const torus=new THREE.Mesh(geometry2,material2);scene.add(torus);camera.position.z=5;let mouseX=0,mouseY=0;document.addEventListener("mousemove",(e)=>{mouseX=(e.clientX/window.innerWidth-0.5)*2;mouseY=(e.clientY/window.innerHeight-0.5)*2});function animate(){requestAnimationFrame(animate);mesh.rotation.x+=0.005;mesh.rotation.y+=0.008;torus.rotation.x-=0.003;torus.rotation.y-=0.005;mesh.rotation.x+=mouseY*0.001;mesh.rotation.y+=mouseX*0.001;renderer.render(scene,camera)}animate();window.addEventListener("resize",()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)})</script></body></html>
