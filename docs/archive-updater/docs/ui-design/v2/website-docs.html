<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>文档中心 - DSH 插件升级管理 v2</title><style>:root{--primary:#6366F1;--primary-light:#818CF8;--accent:#10B981;--warning:#F59E0B;--bg-primary:#0F172A;--bg-secondary:#1E293B;--bg-tertiary:#334155;--text-primary:#F8FAFC;--text-secondary:#CBD5E1;--text-muted:#94A3B8}body{font-family:Inter,sans-serif;background:var(--bg-primary);color:var(--text-primary);margin:0;padding:0}.glass{background:rgba(30,41,59,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1)}.header{position:fixed;top:0;left:0;right:0;z-index:100;padding:16px 24px}.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}.logo{display:flex;align-items:center;gap:12px;text-decoration:none}.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--primary),var(--primary-light));border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}.nav a{color:var(--text-secondary);margin-left:32px;text-decoration:none;font-size:15px}.nav a:hover,.nav a.active{color:var(--primary-light)}.main{padding:100px 24px 60px;max-width:1200px;margin:0 auto;display:flex;gap:40px}.sidebar{width:240px;flex-shrink:0;position:sticky;top:100px;height:fit-content}.sidebar h3{font-size:16px;font-weight:600;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--primary)}.sidebar ul{list-style:none;padding:0}.sidebar li{margin-bottom:4px}.sidebar a{display:block;padding:8px 12px;color:var(--text-secondary);text-decoration:none;border-radius:4px;font-size:14px}.sidebar a:hover,.sidebar a.active{background:rgba(99,102,241,0.2);color:var(--primary-light)}.content{flex:1}.content article{margin-bottom:60px}.content h1{font-size:28px;font-weight:700;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.1)}.content h2{font-size:20px;font-weight:600;margin:28px 0 16px;color:var(--primary-light)}.content p{font-size:15px;line-height:1.8;color:var(--text-secondary);margin-bottom:16px}.content code{background:var(--bg-tertiary);padding:2px 6px;border-radius:4px;font-size:13px;color:var(--warning);font-family:monospace}.content pre{background:var(--bg-secondary);padding:16px;border-radius:8px;overflow-x:auto;margin:16px 0}.content pre code{background:none;color:var(--text-primary);padding:0}.warning{background:rgba(245,158,11,0.1);border-left:4px solid var(--warning);padding:16px;border-radius:0 8px 8px 0;margin:16px 0}</style></head><body><header class="header glass"><div class="header-inner"><a href="website-index.html" class="logo"><div class="logo-icon">DSH</div><span style="font-size:18px;font-weight:700">插件升级管理</span></a><nav class="nav"><a href="website-index.html">首页</a><a href="website-plugins.html">插件市场</a><a href="website-download.html">下载</a><a href="website-docs.html" class="active">文档</a></nav></div></header><main class="main"><aside class="sidebar glass" style="padding:20px;border-radius:16px"><h3>文档目录</h3><ul><li><a href="#quick-start" class="active">快速开始</a></li><li><a href="#installation">安装指南</a></li><li><a href="#basic-usage">基本使用</a></li><li><a href="#plugin-manifest">插件清单规范</a></li><li><a href="#faq">常见问题</a></li></ul></aside><div class="content"><article id="quick-start"><h1>快速开始</h1><p>DSH 插件升级管理工具是一个独立运行的桌面程序。</p></article><article id="installation"><h1>安装指南</h1><p>从下载页面获取安装包。</p></article><article id="basic-usage"><h1>基本使用</h1><p>输入插件目录路径，点击扫描。</p><div class="warning"><strong>注意：</strong>更新前建议关闭 Agent 本体</div></article><article id="plugin-manifest"><h1>插件清单规范</h1><p>每个插件需要 plugin.manifest.json 文件。</p></article><article id="faq"><h1>常见问题</h1><p>Q: 检查更新失败？A: 检查网络连接。</p></article></div></main></body></html>
