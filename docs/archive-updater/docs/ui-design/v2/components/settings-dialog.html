<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设置对话框</title>
<style>
:root{--primary:#6366F1;--primary-light:#818CF8;--bg:#0F172A;--card:#1E293B;--border:rgba(255,255,255,0.1);--text:#F8FAFC;--muted:#94A3B8}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);margin:0;padding:40px}
.glass{background:rgba(30,41,59,0.8);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:20px}
/* 弹窗遮罩 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{width:680px;max-height:90vh;overflow-y:auto;padding:32px;position:relative}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:rgba(239,68,68,0.2);color:#EF4444}
.modal h2{font-size:20px;font-weight:600;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
/* 标签页 */
.tabs{display:flex;gap:8px;margin-bottom:24px}
.tab{padding:8px 16px;border-radius:10px;font-size:13px;cursor:pointer;background:transparent;border:1px solid var(--border);color:var(--muted);transition:all 0.2s}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.tab:hover:not(.active){background:rgba(255,255,255,0.05)}
/* 设置区块 */
.section{margin-bottom:24px}
.section-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(255,255,255,0.03);border-radius:12px;margin-bottom:8px;border:1px solid transparent}
.setting-row:hover{border-color:var(--border)}
.setting-label{font-size:14px}
.setting-desc{font-size:12px;color:var(--muted);margin-top:2px}
/* 输入框 */
input[type="text"],input[type="password"],select{background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;outline:none;width:200px}
input:focus,select:focus{border-color:var(--primary)}
/* 开关 */
.toggle{position:relative;width:44px;height:24px;background:rgba(255,255,255,0.1);border-radius:12px;cursor:pointer;transition:all 0.2s}
.toggle.on{background:var(--primary)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:all 0.2s}
.toggle.on::after{left:22px}
/* 底部按钮 */
.modal-footer{display:flex;justify-content:flex-end;gap:12px;margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.btn{padding:10px 20px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all 0.2s}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff}
.btn-primary:hover{box-shadow:0 4px 16px rgba(99,102,241,0.4)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{background:rgba(255,255,255,0.05);color:var(--text)}
</style>
</head>
<body>
<div class="modal-overlay">
  <div class="modal glass">
    <button class="modal-close">×</button>
    <h2>⚙️ 设置</h2>
    <div class="tabs">
      <span class="tab active">通用</span>
      <span class="tab">代理设置</span>
      <span class="tab">GitHub</span>
      <span class="tab">通知</span>
    </div>
    <div class="section">
      <div class="section-title">扫描与路径</div>
      <div class="setting-row">
        <div>
          <div class="setting-label">插件目录</div>
          <div class="setting-desc">Agent 根目录下的 plugins 文件夹</div>
        </div>
        <input type="text" value="C:\Users\<用户名>\.dsh\plugins">
      </div>
      <div class="setting-row">
        <div>
          <div class="setting-label">扫描深度</div>
          <div class="setting-desc">递归扫描的子目录层数</div>
        </div>
        <select><option>1（仅根目录）</option><option>2</option><option>3</option></select>
      </div>
    </div>
    <div class="section">
      <div class="section-title">代理配置</div>
      <div class="setting-row">
        <div>
          <div class="setting-label">网络代理</div>
          <div class="setting-desc">通过官方加速 GitHub 访问</div>
        </div>
        <div class="toggle on" onclick="this.classList.toggle('on')"></div>
      </div>
      <div class="setting-row">
        <div>
          <div class="setting-label">代理地址</div>
        </div>
        <input type="text" value="http://192.0.2.10:8080">
      </div>
    </div>
    <div class="section">
      <div class="section-title">通知</div>
      <div class="setting-row">
        <div>
          <div class="setting-label">更新完成通知</div>
        </div>
        <div class="toggle on" onclick="this.classList.toggle('on')"></div>
      </div>
      <div class="setting-row">
        <div>
          <div class="setting-label">静默模式</div>
          <div class="setting-desc">后台运行不弹窗</div>
        </div>
        <div class="toggle" onclick="this.classList.toggle('on')"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost">取消</button>
      <button class="btn btn-primary">保存</button>
    </div>
  </div>
</div>
</body>
</html>
